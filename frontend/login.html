
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Medical Portal | Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 520px;
      padding: 32px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 15px 45px rgba(19, 37, 66, .08);
    }
    .login-card h1 {
      font: 800 27px Manrope, sans-serif;
      margin: 8px 0;
    }
    .login-card p { color: var(--muted); }
    .login-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 25px;
    }
    .login-option {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-align: center;
      background: #f8faff;
    }
    .login-option:hover {
      border-color: var(--blue);
      background: #eef3ff;
    }
    .login-option strong { display: block; margin: 8px 0; }
    .login-option small { color: var(--muted); }
    @media (max-width: 480px) {
      .login-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <div class="eyebrow">COLLEGE HEALTH SERVICES</div>
      <h1>College Medical Portal</h1>
      <p>Sign in using your authorized college account.</p>

      <div class="login-options">
        <a class="login-option" href="/student-login.html">
          <span style="font-size:32px">🎓</span>
          <strong>Student Login</strong>
          <small>Official college email</small>
        </a>
        <a class="login-option" href="/staff-login.html">
          <span style="font-size:32px">🩺</span>
          <strong>Medical Staff Login</strong>
          <small>Doctors and nurses</small>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
